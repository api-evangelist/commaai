aid: commaai
name: Comma.ai
description: >-
  Comma.ai builds openpilot, an open-source driver-assistance / robotics operating
  system that runs on comma hardware (comma 3X, comma four) and upgrades adaptive
  cruise control and lane centering on 300+ supported cars. Alongside the open-source
  stack, comma operates the comma connect cloud platform and a documented JWT-authenticated
  REST API (api.commadotai.com) that exposes device management, driving routes and
  segments, video and log access, real-time device communication via athena, comma
  prime billing, and turn-by-turn navigation. Backed by a16z, comma also publishes
  large open driving datasets (comma2k19, commaVQ) and the opendbc "Python API for
  your car." This profile catalogs comma's public developer surface for the API
  Evangelist network.
