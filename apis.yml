  description: >-
    The comma connect API is a JWT-authenticated REST API for comma / openpilot users and devices. It
    exposes the authenticated user profile and device list, per-device operations (info, location, stats,
    pairing, user access grants, boot and crash logs), driving routes and segments with signed URLs to
    video, GPS paths and events, real-time device communication over the athena JSON-RPC websocket, comma
    prime subscription and payment management, and turn-by-turn navigation (destinations and saved locations).
    Tokens are minted at jwt.comma.ai and passed as `Authorization: JWT {token}`.
